# .ainative/project.yaml — Zharfa (live project manifest; source: AiNative methodology)
#
# `validation_commands` are run by the tester state for managed work. The
# worker never runs them. Commands below prove the frontend builds, the API and
# desktop shell compile, and the backend unit suites (specs 002, 003, 004, 005 and 006) pass.
# Spec 004 adds the unit suites under backend/Zharfa.Api.Tests/Purchasing/Reports/
# (period, trend window, catalog, filters, print limit) and the purchasing
# sync/mapping suites. Spec 005 adds the unit suites under Security/*, Audit/*,
# DataQuality/* and updated Platform/*. Spec 006 adds the unit suites under
# backend/Zharfa.Api.Tests/Ai/* (allowlist, period default, payload scrub, flag, gate).
# The Docker stack, Mabna simulator, and HTTP/UI proof are exercised by the tester's
# quickstart flows (specs/006-local-ai-purchasing/quickstart.md), not here. Do not add
# GPU or Ollama to validation_commands.

validation_commands:
  # Frontend (React + TypeScript + Vite): install deps, then a production build.
  - npm --prefix frontend install --no-audit --no-fund
  - npm --prefix frontend run build
  # Backend API (ASP.NET Core, net10.0): compile. .NET 10 SDK is user-local at
  # ~/.dotnet (PATH is set inline below). Invariant globalization is forced
  # because this host has no libicu and no root to install it — the runtime
  # Docker images ship ICU, so this is a host-only accommodation.
  - PATH="$HOME/.dotnet:$PATH" DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 dotnet build backend/Zharfa.Api/Zharfa.Api.csproj
  # Desktop shell (WPF + WebView2, net10.0-windows): compiles on any OS via
  # EnableWindowsTargeting; running requires Windows + WebView2 Runtime.
  - PATH="$HOME/.dotnet:$PATH" DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 dotnet build desktop/Zharfa.Desktop/Zharfa.Desktop.csproj
  # Backend unit tests (xunit, specs 002, 003 and 004): pure logic only, no database or network.
  - PATH="$HOME/.dotnet:$PATH" DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 dotnet test backend/Zharfa.Api.Tests/Zharfa.Api.Tests.csproj

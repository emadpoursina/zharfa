# Zharfa — self-hosted deployment: PostgreSQL, backend API, and the
# web/reverse-proxy service that serves the shared Persian RTL frontend.
#
# ZHARFA_DATA_MODE (required, deploy/.env) sets the install's data mode once:
# "production" shows real Mabna purchasing data only; "demo" shows the synthetic
# demonstration data and labels everything as demonstration. The API refuses to
# start without it. The Mabna connector is read-only and stays disabled until its
# variables are set. Secrets come from deploy/.env (gitignored) or Docker secrets —
# never from the frontend bundle or the repository.

name: zharfa

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zharfa}
      POSTGRES_USER: ${POSTGRES_USER:-zharfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - zharfa-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Install data mode (FR-020): required, "production" or "demo"; the API refuses to start without it.
      # Also read by `docker compose run --rm api reconcile purchasing …` (spec 003, T056).
      Zharfa__DataMode: ${ZHARFA_DATA_MODE:?set ZHARFA_DATA_MODE in deploy/.env (production or demo)}
      ConnectionStrings__Zharfa: "Host=db;Port=5432;Database=${POSTGRES_DB:-zharfa};Username=${POSTGRES_USER:-zharfa};Password=${POSTGRES_PASSWORD}"
      # Single AI provider for Demo 1; values come from deploy/.env only.
      AiProvider__Name: ${AI_PROVIDER_NAME:-}
      AiProvider__Endpoint: ${AI_PROVIDER_ENDPOINT:-}
      AiProvider__Model: ${AI_PROVIDER_MODEL:-}
      AiProvider__ApiKey: ${AI_PROVIDER_API_KEY:-}
      # Flow E Development capture: compose must include deploy/docker-compose.9router.yml;
      # probe http://shared_9router:20128/v1 from the api container before enable+chat.
      AiProvider__CapturePath: ${AiProvider__CapturePath:-}
      # Local AI provider (Phase 4); values come from deploy/.env only.
      LocalAi__Name: ${LOCAL_AI_NAME:-ollama}
      LocalAi__Endpoint: ${LOCAL_AI_ENDPOINT:-}
      LocalAi__Model: ${LOCAL_AI_MODEL:-}
      Inventory__LowStockThreshold: ${INVENTORY_LOW_STOCK_THRESHOLD:-10}
      # Mabna read-only source (spec 002/003). Unset = connector and sync stay disabled; the API still starts.
      # Values come from deploy/.env only. The file paths are container paths under the read-only mount below.
      ConnectionStrings__Mabna: ${ConnectionStrings__Mabna:-}
      MabnaSource__AllowlistFile: ${MabnaSource__AllowlistFile:-}
      MabnaSource__CommandTimeoutSeconds: ${MabnaSource__CommandTimeoutSeconds:-60}
      MabnaSync__SourceMapFile: ${MabnaSync__SourceMapFile:-}
      # Purchasing discount basis (line | lineAndDocument); production refuses to start unless it equals the verified map basis.
      Purchasing__DiscountBasis: ${Purchasing__DiscountBasis:-}
      # Nightly incremental sync and page size (contracts/cli-and-config.md §2). Blank = documented default.
      # Sync__FaultInjection__* is not passed here: it is dev-only and lives in docker-compose.purchasing-dev.yml.
      Sync__NightlyTime: ${Sync__NightlyTime:-}
      Sync__TimeZone: ${Sync__TimeZone:-}
      Sync__WeeklyFullLoadDay: ${Sync__WeeklyFullLoadDay:-}
      Sync__PageSize: ${Sync__PageSize:-}
      Sync__MaxRejectedRows: ${Sync__MaxRejectedRows:-}
      # Data-quality earliest plausible document date (Jalali yyyy-mm-dd); blank = default 1390-01-01.
      DataQuality__EarliestJalaliDate: ${DataQuality__EarliestJalaliDate:-}
      # First-run production Admin (used only while no active Admin exists; never logged). Blank in demo installs.
      Bootstrap__AdminUsername: ${Bootstrap__AdminUsername:-}
      Bootstrap__AdminPassword: ${Bootstrap__AdminPassword:-}
      Bootstrap__AdminPasswordFile: ${Bootstrap__AdminPasswordFile:-}
      # Container clock in Tehran time, matching the default Sync__TimeZone (Asia/Tehran).
      TZ: Asia/Tehran
    volumes:
      # Gitignored host folder with the purchasing source map and the allowlist; read-only in the container.
      # Its contents never enter git (deploy/mabna-config/* is ignored except .gitkeep).
      - type: bind
        source: ${ZHARFA_MABNA_CONFIG_DIR:-./mabna-config}
        target: /etc/zharfa/mabna
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    ports:
      - "${ZHARFA_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  zharfa-postgres:
